name: inventory
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.2.5
  qr_flutter: ^4.1.0
  supabase_flutter: ^2.8.0
  image_picker: ^1.0.7
  permission_handler: ^11.3.1
  mobile_scanner: ^5.0.0
  provider: ^6.1.2
  path: ^1.9.0
  image_gallery_saver_plus: ^4.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Untuk ganti icon aplikasi
  flutter_launcher_icons: ^0.13.1

  # Untuk ganti splash screen (hilangkan logo Flutter)
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# =========================
# APP ICON (ANDROID & IOS)
# =========================
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/logo.png
  min_sdk_android: 21

# =========================
# SPLASH SCREEN
# =========================
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png

  android_12:
    color: "#FFFFFF"
    image: assets/images/logo.png
